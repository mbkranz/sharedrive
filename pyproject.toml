[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sharedrive"
version = "0.0.1"
description = "Convenient connectors to make interoperating and collaborating across multiple content management systems easier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "typer>=0.24.1",
    "boto3>=1.42.55",
    "cloudpathlib[s3]>=0.23.0",
    # TODO: Move below dependencies to own groups? Make separate packages for each type of tool?
    "GitPython>=3.1.44",
    "google-auth-oauthlib>=1.2.1",
    "google>=3.0.0",
    # TODO: add to dedicated lib
    "msal>=1.33.0",
    "dplib-py>=1.1.0",
]   

[project.scripts]
sharedrive = "sharedrive.cli:main"

[project.optional-dependencies]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
]
dev-datamgmt = [
    "frictionless"
]


[dependency-groups]
dev = [
    "jupyter",
    "black",
    "ipykernel>=6.29.5",
    "ruff>=0.11.5",
    {include-group = "test"}
]
test = [
    "pytest"
]

[tool.setuptools]
packages = ["sharedrive", "sharedrive.actions", "sharedrive.auth", "sharedrive.clients"]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
docstring-code-format = true
skip-magic-trailing-comma = true
preview = true  # Enables improved formatter behavior

[tool.uv.workspace]
members = [
    "submodules/dplib-py",
]

[tool.uv.sources]
dplib-py = { workspace = true }

